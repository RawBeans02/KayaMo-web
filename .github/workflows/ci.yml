name: CI

# Clerk: the publishable key is public by design and lives in a repository
# variable; the secret key is a repository secret. Without them the build
# and the demo still pass, and the Clerk e2e specs self-skip.
env:
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
  CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /login
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
  NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /auth/bridge
  NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /auth/bridge
on: [push, pull_request]
# Read-only token: nothing here writes to the repository.
permissions:
  contents: read
# A push to a branch with an open PR used to run everything twice; a new push
# now cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: Banned-copy sweep
        run: pnpm check:copy
      - name: Security dependency compatibility
        run: pnpm test:security
      - name: Production dependency security audit
        run: pnpm audit --prod --audit-level high
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy
        run: pnpm build

  database-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Start disposable Supabase
        run: |
          supabase start -x \
            realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > /dev/null
      - name: Replay every migration from an empty database
        run: supabase db reset --local --no-seed
      - name: Export disposable test credentials
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            | node scripts/github-supabase-env.mjs
      - name: Run live RLS, sequence, catalog, and PostgREST tests
        run: pnpm test:db:integration
      - name: Run offline sync regressions
        run: pnpm --filter @kayamo/offline test
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps
      - name: Full website regressions (demo and disposable authenticated account)
        run: pnpm exec playwright test
      - name: Keep the Playwright report and traces when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup

  # The same suite against `next build` + `next start`. Until 2026-09-19 CI
  # only ever served `next dev`, and the two disagree (webpack vs Turbopack,
  # NODE_ENV, static analysis of the proxy matcher), so a build-only failure
  # could reach main unseen. Authenticated specs self-skip here: the local
  # skip-login is a development-only route.
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Start disposable Supabase
        run: |
          supabase start -x \
            realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor \
            > /dev/null
      - name: Apply every migration
        run: supabase db reset --local --no-seed
      - name: Export disposable test credentials
        run: |
          supabase status -o env \
            --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            --override-name auth.service_role_key=SUPABASE_SERVICE_ROLE_KEY \
            --override-name db.url=SUPABASE_DB_URL \
            | node scripts/github-supabase-env.mjs
      - name: Production build
        run: pnpm build
      - name: Install Playwright browsers
        run: pnpm exec playwright install chromium firefox webkit --with-deps
      - name: Website regressions against the production build
        env:
          PLAYWRIGHT_WEB_SERVER: start
        run: pnpm exec playwright test
      - name: Keep the Playwright report and traces when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-production
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
